name: Build release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check tag matches manifest version
        run: |
          manifest_version=$(jq -r .version manifest.json)
          if [[ "v$manifest_version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - name: Lint
        run: npx --yes web-ext@10 lint --source-dir . --self-hosted=false

      - name: Build
        run: npx --yes web-ext@10 build --source-dir . --artifacts-dir dist --filename "yt-pin-channel-{version}.zip" --ignore-files amo-metadata.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
